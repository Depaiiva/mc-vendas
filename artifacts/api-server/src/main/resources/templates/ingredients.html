<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingredientes e compras · Doce & Pão</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/navigation :: navigation('ingredients')}"></div>
    <main class="main-content">
        <div class="page-heading"><div><p class="eyebrow">CUSTOS E ABASTECIMENTO</p><h1>Ingredientes e compras</h1>
            <p class="page-subtitle">Mantenha os ingredientes e acompanhe o que foi comprado.</p></div></div>
        <div th:if="${success}" class="notice notice-success" th:text="${success}" role="status"></div>
        <div th:if="${error}" class="notice notice-error" th:text="${error}" role="alert"></div>
        <div class="two-column">
            <section class="section-block panel">
                <div class="section-heading"><div><span class="section-kicker">01</span><h2>Novo ingrediente</h2></div></div>
                <form th:action="@{/ingredients/save}" method="post" class="form-stack">
                    <div class="field"><label for="ingredientName">Nome</label><input id="ingredientName" name="name" required maxlength="120"></div>
                    <div class="field"><label for="ingredientUnit">Unidade de medida</label>
                        <select id="ingredientUnit" name="unit">
                            <option th:each="measure : ${measures}" th:value="${measure}" th:text="${@labels.measure(measure)}"></option>
                        </select></div>
                    <button class="button button-primary" type="submit">Adicionar ingrediente</button>
                </form>
                <div class="ingredient-list">
                    <article class="ingredient-row" th:each="ingredient : ${ingredients}">
                        <form th:action="@{/ingredients/save}" method="post" class="ingredient-edit">
                            <input type="hidden" name="id" th:value="${ingredient.id}">
                            <div class="field"><label th:for="${'ingredient-' + ingredient.id}">Ingrediente</label>
                                <input th:id="${'ingredient-' + ingredient.id}" name="name" th:value="${ingredient.name}" required></div>
                            <div class="field"><label th:for="${'unit-' + ingredient.id}">Unidade</label>
                                <select th:id="${'unit-' + ingredient.id}" name="unit">
                                    <option th:each="measure : ${measures}" th:value="${measure}" th:text="${@labels.measure(measure)}"
                                            th:selected="${measure == ingredient.unit}"></option>
                                </select></div>
                            <button class="button button-quiet" type="submit">Salvar</button>
                        </form>
                    </article>
                </div>
            </section>
            <section class="section-block panel">
                <div class="section-heading"><div><span class="section-kicker">02</span><h2>Registrar compra</h2></div></div>
                <form th:action="@{/ingredients/purchases}" method="post" class="form-stack">
                    <div class="field"><label for="purchaseDate">Data</label><input id="purchaseDate" name="date" type="date"
                            th:value="${today}" required></div>
                    <div class="field"><label for="purchaseIngredient">Ingrediente</label>
                        <select id="purchaseIngredient" name="ingredientId" required>
                            <option value="">Selecione</option>
                            <option th:each="ingredient : ${ingredients}" th:value="${ingredient.id}"
                                    th:text="${ingredient.name + ' · ' + @labels.measure(ingredient.unit)}"></option>
                        </select></div>
                    <div class="form-pair">
                        <div class="field"><label for="purchaseQuantity">Quantidade</label><input id="purchaseQuantity" name="quantity" type="number" min="0.001" step="0.001" required></div>
                        <div class="field"><label for="purchasePrice">Preço por unidade (R$)</label><input id="purchasePrice" name="unitPrice" type="number" min="0.01" step="0.01" required></div>
                    </div>
                    <button class="button button-primary" type="submit">Registrar compra</button>
                </form>
            </section>
        </div>
        <section class="section-block">
            <div class="section-heading"><div><span class="section-kicker">03</span><h2>Compras do período</h2></div>
                <div class="period-total">Total <strong th:text="${@labels.money(purchaseTotal)}"></strong></div></div>
            <form class="date-filter date-range" th:action="@{/ingredients}" method="get">
                <label for="purchaseStart">De</label><input id="purchaseStart" name="start" type="date" th:value="${startDate}">
                <label for="purchaseEnd">Até</label><input id="purchaseEnd" name="end" type="date" th:value="${endDate}">
                <button class="button button-secondary" type="submit">Filtrar</button>
            </form>
            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>Data</th><th>Ingrediente</th><th>Quantidade</th><th>Preço unitário</th><th>Total</th></tr></thead>
                    <tbody>
                    <tr th:each="purchase : ${purchases}">
                        <td th:text="${@labels.date(purchase.date)}"></td>
                        <td><strong th:text="${purchase.ingredient.name}"></strong><small th:text="${@labels.measure(purchase.ingredient.unit)}"></small></td>
                        <td th:text="${#numbers.formatDecimal(purchase.quantity, 1, 3, 'COMMA')}"></td>
                        <td th:text="${@labels.money(purchase.unitPrice)}"></td>
                        <td><strong th:text="${@labels.money(purchase.calculateTotalCost())}"></strong></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(purchases)}"><td colspan="5" class="table-empty">Nenhuma compra nesse período.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
