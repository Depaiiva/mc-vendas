server.port=${PORT:8080}
# server.servlet.context-path=/api
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.application.name=campus-sales-admin
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/app.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=false
spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
spring.profiles.default=dev
logging.level.org.springframework.security=INFO
app.time-zone=America/Sao_Paulo

ADMIN_USERNAME=admin
ADMIN_PASSWORD=suasenha123

springdoc.model-and-view-allowed=true
springdoc.packages-to-scan=br.com.depaiva.web
springdoc.swagger-ui.path=/swagger-ui.html